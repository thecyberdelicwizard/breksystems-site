<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Logo motion preview</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0.04em;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
      color: #ffffff99;
      pointer-events: none;
    }
    .hud .name { color: #fff; text-transform: uppercase; }
    .hud .tag { color: #ffffff66; }
    .note { color: #ffffff99; pointer-events: auto; }
    .note button {
      font: inherit;
      color: #fff;
      background: none;
      border: 0;
      border-bottom: 1px solid #ffffff66;
      padding: 0;
      cursor: pointer;
    }
    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px;
    }
    .controls button {
      font: inherit;
      color: #fff;
      background: #000;
      border: 1px solid #ffffff4d;
      border-radius: 0;
      min-width: 40px;
      height: 44px;
      padding: 0 10px;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .controls button:hover { border-color: #ffffffb3; }
    .controls #size:disabled { display: none; }
    .controls button:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
    .controls button[aria-pressed="true"] { background: #fff; color: #000; border-color: #fff; }
    .controls .opt small {
      font-size: 8px;
      letter-spacing: 0.08em;
      margin-top: 3px;
      opacity: 0.7;
    }
    .controls { column-gap: 14px; row-gap: 6px; }
    .controls .grp { display: flex; gap: 6px; align-items: center; }
    .controls .glabel { font-size: 9px; letter-spacing: 0.1em; color: #ffffff66; margin-right: 2px; }
    @media (max-width: 440px) {
      .controls { padding: 0 6px; }
      .controls .grp { gap: 4px; }
      .controls button { min-width: 32px; height: 40px; padding: 0 6px; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Brek Systems logo animation"></canvas>
  <noscript><img src="../../brek-mark.png" alt="Brek Systems" style="position:fixed;inset:0;margin:auto;width:120px"></noscript>

  <div class="hud" aria-live="polite">
    <span id="idx">01/05</span>
    <span class="name" id="name">Clean Sweep</span>
    <span class="tag" id="tag"></span>
    <span class="note" id="note" hidden></span>
  </div>

  <nav class="controls" aria-label="Animation options">
    <div class="grp" role="group" aria-label="Loop">
      <span class="glabel">LOOP</span>
      <button class="opt" data-i="0" aria-pressed="true" title="Clean Sweep">1</button>
      <button class="opt" data-i="1" aria-pressed="false" title="Signal Drop (hover)">2<small>HOVER</small></button>
      <button class="opt" data-i="2" aria-pressed="false" title="Scan Log (hover)">3<small>HOVER</small></button>
      <button class="opt" data-i="3" aria-pressed="false" title="Blueprint">4</button>
      <button class="opt" data-i="4" aria-pressed="false" title="Star Burst">5</button>
      <button class="opt" data-i="5" aria-pressed="false" title="Final (Clean Sweep + streaks)">6<small>FINAL</small></button>
    </div>
    <div class="grp" role="group" aria-label="Flip">
      <span class="glabel">FLIP</span>
      <button class="opt" data-i="6" aria-pressed="false" title="Hard Cut Countdown">7</button>
      <button class="opt" data-i="7" aria-pressed="false" title="Flipbook 3D">8</button>
      <button class="opt" data-i="8" aria-pressed="false" title="Archive Scan">9</button>
      <button class="opt" data-i="9" aria-pressed="false" title="Glitch Swap">10</button>
      <button class="opt" data-i="10" aria-pressed="false" title="Ghost Stack">11</button>
    </div>
    <div class="grp" role="group" aria-label="Wild">
      <span class="glabel">WILD</span>
      <button class="opt" data-i="11" aria-pressed="false" title="Signal Hunt">12</button>
      <button class="opt" data-i="12" aria-pressed="false" title="Exploded Archive">13</button>
    </div>
    <div class="grp">
      <button id="replay" title="Replay (R)">Replay</button>
      <button id="size" title="Toggle logo size">Large</button>
    </div>
  </nav>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Mark geometry: the homepage brek-mark.png (282x281) traced into one rect per
  // line. Same numbers as brek-mark-lines.svg in this folder.
  // ---------------------------------------------------------------------------
  const MARK_W = 282, MARK_H = 281;
  const BARS = [
    [0, 133.61, 0.69, 14.64, 13.91],
    [1, 128.71, 23.61, 24.47, 13.12],
    [2, 117.00, 45.81, 47.76, 12.93],
    [3, 102.69, 68.00, 76.34, 12.96],
    [4, 81.34, 90.24, 46.60, 12.93], [4, 153.75, 90.24, 44.26, 12.95],
    [5, 44.48, 112.21, 61.61, 13.27], [5, 175.64, 112.21, 61.63, 13.27],
    [6, 0.82, 134.46, 83.43, 12.82], [6, 197.65, 134.46, 83.39, 12.82],
    [7, 44.49, 156.49, 61.50, 13.09], [7, 175.66, 156.49, 61.51, 13.09],
    [8, 83.65, 178.54, 44.26, 13.13], [8, 153.76, 178.54, 46.61, 13.11],
    [9, 102.71, 200.78, 76.20, 12.89],
    [10, 117.00, 223.00, 47.91, 12.93],
    [11, 128.71, 244.85, 24.44, 13.05],
    [12, 133.60, 267.15, 14.69, 13.82],
  ].map(([row, x, y, w, h]) => ({ row, x, y, w, h, g: Math.abs(row - 6) }));
  const MAX_G = 6;

  // ---------------------------------------------------------------------------
  // Math / easing
  // ---------------------------------------------------------------------------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const clamp01 = v => clamp(v, 0, 1);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smoothstep = (a, b, v) => { const k = clamp01((v - a) / (b - a)); return k * k * (3 - 2 * k); };
  const pad = (n, len) => String(Math.max(0, Math.floor(n))).padStart(len, '0');

  function cubicBezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t;
    const sy = t => ((ay * t + by) * t + cy) * t;
    const dsx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const err = sx(t) - x;
        if (Math.abs(err) < 1e-6) return sy(t);
        const d = dsx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= err / d;
      }
      let lo = 0, hi = 1;
      t = x;
      while (hi - lo > 1e-6) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const EASE_IN = cubicBezier(0.16, 1, 0.3, 1);     // landing
  const EASE_OUT = cubicBezier(0.7, 0, 0.84, 0);    // leaving
  const BACK_OUT = cubicBezier(0.34, 1.56, 0.64, 1);
  const BACK_MAX = (() => { let m = 1; for (let i = 0; i <= 400; i++) m = Math.max(m, BACK_OUT(i / 400)); return m; })();
  const expoOut = p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
  const expoIn = p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10));
  const inOutCubic = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const outCubic = p => 1 - Math.pow(1 - p, 3);

  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const SESSION_SEED = (Math.random() * 1e9) | 0;

  // ---------------------------------------------------------------------------
  // Canvas + layout
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('stage');
  const main = canvas.getContext('2d');
  const buf = document.createElement('canvas');
  const bctx = buf.getContext('2d');
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';

  const noise = document.createElement('canvas');
  noise.width = 512; noise.height = 64;
  (() => {
    const n = noise.getContext('2d');
    const img = n.createImageData(noise.width, noise.height);
    for (let i = 0; i < img.data.length; i += 4) {
      const on = Math.random() < 0.5 ? 255 : 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = on;
    }
    n.putImageData(img, 0, 0);
  })();

  let sizeMode = 'large';
  let L = null;

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = buf.width = Math.round(vw * dpr);
    canvas.height = buf.height = Math.round(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    const S = (STYLES[current]?.size || sizeMode) === 'site'
      ? clamp(vw * 0.18, 72, 120)          // same rule as the homepage .mark
      : Math.max(72, Math.min(vw * 0.62, (vh - 190) * 0.85, 340));
    const s = S / MARK_W, lw = S, lh = MARK_H * s;
    const ox = Math.round((vw - lw) / 2), oy = Math.round((vh - lh) / 2 - 18);
    L = {
      vw, vh, dpr, s, ox, oy, lw, lh, cx: ox + lw / 2, cy: oy + lh / 2,
      rects: BARS.map(b => ({ x: ox + b.x * s, y: oy + b.y * s, w: b.w * s, h: b.h * s, g: b.g, row: b.row })),
    };
    buildRasters();
  }

  // ---------------------------------------------------------------------------
  // Shared line motion. A line enters from off-screen left at scaleX 0.2 with a
  // left origin, lands at full length, then exits with a right origin,
  // stretching to EXIT_STRETCH times its length until it clears the right edge.
  // Expressed as left/width rather than a transform so lines stay crisp.
  // ---------------------------------------------------------------------------
  const EXIT_STRETCH = 3;

  function enterGeom(r, pos, scale) {
    const start = -r.w * 0.2 - 4;
    return { x: lerp(start, r.x, pos), w: r.w * scale };
  }
  function exitGeom(r, p, stretch = EXIT_STRETCH) {
    const r0 = r.x + r.w;
    const rEnd = L.vw + r.w * stretch + 4;
    const right = lerp(r0, rEnd, p);
    const w = r.w * lerp(1, stretch, p);
    return { x: right - w, w };
  }
  // Progress of one line inside a phase where lines are staggered by group
  // (distance from the middle row), with the whole phase fitting in `dur`.
  function stag(t, start, dur, st, g) {
    const d = dur - st * MAX_G;
    return clamp01((t - start - g * st) / d);
  }
  function stdGeom(r, t, c) {
    if (t < c.holdEnd) {
      const p = stag(t, c.inStart, c.inDur, c.inSt, r.g);
      if (p <= 0) return null;
      const e = EASE_IN(p);
      return enterGeom(r, e, 0.2 + 0.8 * e);
    }
    const p = stag(t, c.holdEnd, c.outDur, c.outSt, r.g);
    if (p >= 1) return null;
    return exitGeom(r, EASE_OUT(p));
  }
  function drawStdBars(ctx, t, c) {
    for (const r of L.rects) {
      const geom = stdGeom(r, t, c);
      if (geom) ctx.fillRect(geom.x, r.y, geom.w, r.h);
    }
  }
  // Motion-blur ghost trailing a moving line, sized from its per-frame travel.
  function drawStreak(ctx, r, g, g0, rgb) {
    const v = g0 ? Math.abs((g.x + g.w) - (g0.x + g0.w)) : 0;
    const len = Math.min(v * 4, L.vw * 0.6);
    if (len <= 2) return;
    const grad = ctx.createLinearGradient(g.x - len, 0, g.x, 0);
    grad.addColorStop(0, `rgba(${rgb},0)`);
    grad.addColorStop(1, `rgba(${rgb},0.45)`);
    ctx.fillStyle = grad;
    ctx.fillRect(g.x - len, r.y + r.h * 0.2, len, r.h * 0.6);
  }
  function drawStaticBars(ctx) {
    for (const r of L.rects) ctx.fillRect(r.x, r.y, r.w, r.h);
  }

  // Copies horizontal bands of the buffer onto the main canvas shifted by dx.
  // Band coordinates are CSS px.
  function applySlices(slices) {
    const d = L.dpr, W = canvas.width;
    for (const sl of slices) {
      if (!sl.dx) continue;
      const y = Math.round(sl.y * d), h = Math.max(1, Math.round(sl.h * d)), dx = Math.round(sl.dx * d);
      main.fillStyle = '#000';
      main.fillRect(0, y, W, h);
      main.drawImage(buf, 0, y, W, h, dx, y, W, h);
    }
  }
  function drawNoiseStrip(x, y, w, h) {
    const d = L.dpr;
    const X = Math.round(x * d), Y = Math.round(y * d), Wd = Math.round(w * d), Hd = Math.max(1, Math.round(h * d));
    const block = 2 * d;
    const sw = Math.max(1, Math.round(Wd / block)), sh = Math.max(1, Math.round(Hd / block));
    const sx = Math.floor(Math.random() * Math.max(1, noise.width - sw));
    const sy = Math.floor(Math.random() * Math.max(1, noise.height - sh));
    main.fillStyle = '#000';
    main.fillRect(X, Y, Wd, Hd);
    main.imageSmoothingEnabled = false;
    main.drawImage(noise, sx, sy, Math.min(sw, noise.width), Math.min(sh, noise.height), X, Y, Wd, Hd);
    main.imageSmoothingEnabled = true;
  }

  // ---------------------------------------------------------------------------
  // Hover controllers. A style opts in with `hover: createX()`. The engine:
  //   - only lets hover run during the style's hold phase,
  //   - exposes env.gate (1 in hold, fades to 0 over 150 ms after the hold ends),
  //   - calls enter/leave for mouse/pen hover over the logo, and touch(type, pt)
  //     for touch input, picking behaviour via the (hover: hover) media query,
  //   - calls update(env) every frame and reset() when the effect is fully off,
  //   - honours `holdWhileHovering: true` to extend the hold while hovered.
  // ---------------------------------------------------------------------------
  const HIT_PAD = 24;
  function hitLogo(x, y, pad = HIT_PAD) {
    return x >= L.ox - pad && x <= L.ox + L.lw + pad && y >= L.oy - pad && y <= L.oy + L.lh + pad;
  }

  function createSignalHover() {
    let st;
    const reset = () => {
      st = { mode: 'idle', at: 0, enterAt: 0, x: 0, y: 0, strips: [], rollAt: -1, noiseAt: -1, noiseNext: 0.3, touchUntil: 0 };
    };
    reset();

    function rollStrips(now) {
      const strips = [];
      let y = L.oy - 6;
      const end = L.oy + L.lh + 6;
      while (y < end) {
        const h = 2 + Math.floor(Math.random() * 5);
        strips.push({ y, h, sign: Math.random() < 0.5 ? -1 : 1 });
        y += h;
      }
      st.strips = strips;
      st.rollAt = now;
    }
    function begin(now) {
      if (st.mode === 'active') return;
      st.mode = 'active';
      st.enterAt = now;
      rollStrips(now);
    }
    function end(now) {
      if (st.mode !== 'active') return;
      st.mode = 'final';
      st.at = now;
    }

    return {
      holdWhileHovering: false,
      reset,
      enter(env) { st.x = env.pointer.x; st.y = env.pointer.y; begin(env.now); },
      leave(env) { end(env.now); },
      touch(type, pt, env) {
        if (type === 'end') return;
        st.x = pt.x; st.y = pt.y;
        st.touchUntil = env.now + 0.6;
        begin(env.now);
      },
      update(env) {
        if (env.hovering) { st.x = env.pointer.x; st.y = env.pointer.y; }
        if (st.mode === 'active' && env.touchMode && !env.hovering && env.now > st.touchUntil) end(env.now);
        if (st.mode === 'final' && env.now - st.at >= 0.06) { st.mode = 'snap'; st.at = env.now; }
        if (st.mode === 'snap' && env.now - st.at >= 0.2) st.mode = 'idle';
        if ((st.mode === 'active' || st.mode === 'final') && env.now - st.rollAt >= 0.05) rollStrips(env.now);
      },
      busy() { return st.mode !== 'idle'; },
      composite(env) {
        if (st.mode === 'idle') return;
        let amp = 1;
        if (st.mode === 'active' && env.now - st.enterAt < 0.08) amp = 0;
        if (st.mode === 'snap') amp = 1 - expoOut(clamp01((env.now - st.at) / 0.2));
        amp *= env.gate;
        if (amp <= 0) return;

        const R = 120;
        const dxOut = Math.max(L.ox - st.x, 0, st.x - (L.ox + L.lw));
        const slices = [];
        for (const s of st.strips) {
          const dy = Math.abs(s.y + s.h / 2 - st.y);
          const d = Math.hypot(dy, dxOut);
          if (d >= R) continue;
          const f = 1 - smoothstep(0, R, d);
          slices.push({ y: s.y, h: s.h, dx: Math.round(s.sign * (2 + 8 * f) * amp) });
        }
        applySlices(slices);

        if (st.mode === 'active' && amp === 1 && env.gate === 1 && env.now - st.noiseAt >= st.noiseNext) {
          const hit = L.rects.find(r => st.x >= r.x - 2 && st.x <= r.x + r.w + 2 && st.y >= r.y - 2 && st.y <= r.y + r.h + 2);
          if (hit) {
            drawNoiseStrip(hit.x - 12, hit.y, hit.w + 24, hit.h);
            st.noiseAt = env.now;
            st.noiseNext = 0.26 + Math.random() * 0.08;
          }
        }
      },
    };
  }

  function createScanHover() {
    let st;
    const reset = () => {
      st = { mode: 'idle', at: 0, x: null, from: 0, alpha: 0, coords: false, cx: 0, cy: 0, touch: null };
    };
    reset();

    function follow(env, x, y) {
      if (st.mode === 'idle' || st.x === null) st.x = L.cx;
      st.mode = 'follow';
      st.target = x;
      st.cx = x; st.cy = y;
      st.coords = true;
    }
    function release(env) {
      if (st.mode !== 'follow') return;
      st.mode = 'return';
      st.at = env.now;
      st.from = st.x;
      st.coords = false;
    }

    return {
      holdWhileHovering: false,
      reset,
      enter(env) { follow(env, env.pointer.x, env.pointer.y); },
      leave(env) { release(env); },
      touch(type, pt, env) {
        if (type === 'start') {
          st.touch = { x0: pt.x, y0: pt.y, t0: env.now, x: pt.x, y: pt.y, dragging: false };
        } else if (type === 'move' && st.touch) {
          st.touch.x = pt.x; st.touch.y = pt.y;
          if (!st.touch.dragging && Math.hypot(pt.x - st.touch.x0, pt.y - st.touch.y0) > 6) st.touch.dragging = true;
          if (st.touch.dragging) follow(env, pt.x, pt.y);
        } else if (type === 'end' && st.touch) {
          if (st.touch.dragging) release(env);
          else { st.mode = 'sweep'; st.at = env.now; st.coords = false; }
          st.touch = null;
        }
      },
      update(env) {
        const dt = env.dt;
        if (st.touch && !st.touch.dragging && env.now - st.touch.t0 > 0.15) {
          st.touch.dragging = true;
          follow(env, st.touch.x, st.touch.y);
        }
        if (env.hovering) { st.target = env.pointer.x; st.cx = env.pointer.x; st.cy = env.pointer.y; }

        if (st.mode === 'follow') {
          st.x += (st.target - st.x) * (1 - Math.pow(0.85, dt * 60));
        } else if (st.mode === 'return') {
          const k = clamp01((env.now - st.at) / 0.4);
          st.x = lerp(st.from, L.cx, outCubic(k));
          if (k >= 1) { st.mode = 'fade'; st.at = env.now; }
        } else if (st.mode === 'sweep') {
          const k = clamp01((env.now - st.at) / 0.6);
          st.x = lerp(L.ox - 30, L.ox + L.lw + 30, k);
          if (k >= 1) { st.mode = 'fade'; st.at = env.now; }
        }

        if (st.mode === 'follow' || st.mode === 'return' || st.mode === 'sweep') st.alpha = Math.min(1, st.alpha + dt / 0.15);
        else if (st.mode === 'fade') {
          st.alpha = Math.max(0, st.alpha - dt / 0.2);
          if (st.alpha <= 0) st.mode = 'idle';
        }
      },
      busy() { return st.mode !== 'idle'; },
      lineX() { return st.x; },
      strength(env) { return st.mode === 'idle' ? 0 : st.alpha * env.gate; },
      label(env) {
        return st.coords && env.gate > 0.5 ? `X:${pad(st.cx, 4)} Y:${pad(st.cy, 4)}` : null;
      },
    };
  }

  // ---------------------------------------------------------------------------
  // Styles. Each: name, loop (s), phases {inEnd, holdEnd, outEnd}, draw(ctx, env)
  // into the buffer (CSS px), optional composite(env) onto the main canvas
  // (device px), optional onLoop(env), optional hover controller.
  // ---------------------------------------------------------------------------
  const STYLES = [];

  // 1. Clean Sweep
  {
    const c = { inStart: 0, inDur: 1.2, inSt: 0.08, holdEnd: 3.2, outDur: 1.0, outSt: 0.08 };
    STYLES.push({
      name: 'Clean Sweep',
      loop: 4.5,
      phases: { inEnd: 1.2, holdEnd: 3.2, outEnd: 4.2 },
      draw(ctx, env) { ctx.fillStyle = '#fff'; drawStdBars(ctx, env.t, c); },
    });
  }

  // 2. Signal Drop
  {
    const c = { inStart: 0, inDur: 1.0, inSt: 0.05, holdEnd: 3.2, outDur: 0.8, outSt: 0.05 };
    let glitches = [];
    STYLES.push({
      name: 'Signal Drop',
      loop: 4.5,
      phases: { inEnd: 1.0, holdEnd: 3.2, outEnd: 4.0 },
      hover: createSignalHover(),
      onLoop(env) {
        const rng = env.rng;
        const n = rng() < 0.5 ? 2 : 3;
        const holdStart = 1.0, hold = 2.2, seg = hold / n;
        glitches = [];
        for (let i = 0; i < n; i++) {
          const start = holdStart + i * seg + 0.15 + rng() * (seg - 0.45);
          const dur = 0.06 + rng() * 0.06;
          const sliceSet = () => {
            const k = 1 + Math.floor(rng() * 3);
            return Array.from({ length: k }, () => ({
              fy: rng(), fh: 3 + rng() * 13, dx: (rng() < 0.5 ? -1 : 1) * (4 + rng() * 8),
            }));
          };
          glitches.push({
            start, dur, a: sliceSet(), b: sliceSet(),
            noise: { fy: rng(), h: 2 + rng() * 3, frames: rng() < 0.5 ? 1 : 2, seen: 0 },
          });
        }
      },
      draw(ctx, env) { ctx.fillStyle = '#fff'; drawStdBars(ctx, env.t, c); },
      composite(env) {
        if (this.hover.busy()) return;
        const t = env.t;
        for (const gl of glitches) {
          if (t < gl.start || t >= gl.start + gl.dur) continue;
          const set = t < gl.start + gl.dur / 2 ? gl.a : gl.b;
          applySlices(set.map(s => ({ y: L.oy + s.fy * L.lh - s.fh / 2, h: s.fh, dx: s.dx })));
          if (gl.noise.seen < gl.noise.frames) {
            gl.noise.seen++;
            const w = L.lw * 1.3;
            drawNoiseStrip(L.cx - w / 2, L.oy + gl.noise.fy * L.lh, w, gl.noise.h);
          }
        }
      },
    });
  }

  // 3. Scan Log
  {
    const IN = 1.2, SCAN = 0.6, HOLD_END = 3.2, OUT = 1.0;
    const bandStops = [];
    for (let d = -40; d <= 40; d += 4) bandStops.push([(d + 40) / 80, 1 - smoothstep(20, 40, Math.abs(d))]);

    STYLES.push({
      name: 'Scan Log',
      loop: 4.5,
      phases: { inEnd: IN, holdEnd: HOLD_END, outEnd: HOLD_END + OUT },
      hover: createScanHover(),
      draw(ctx, env) {
        const t = env.t;
        if (t < IN) {
          const scanX = L.vw * Math.min(1, t / SCAN);
          const e = expoOut(t / IN);
          ctx.save();
          if (t < SCAN) { ctx.beginPath(); ctx.rect(0, 0, scanX, L.vh); ctx.clip(); }
          ctx.fillStyle = '#fff';
          for (const r of L.rects) { const g = enterGeom(r, e, 0.2 + 0.8 * e); ctx.fillRect(g.x, r.y, g.w, r.h); }
          ctx.restore();
          if (t < SCAN) { ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(scanX), 0, 1, L.vh); }
        } else if (t < HOLD_END) {
          const ft = t - IN - 0.04;
          const flicker = ft >= 0 && ft < 0.1 && !(ft >= 0.03 && ft < 0.05) ? 0.85 : 1;
          const m = this.hover.strength(env);
          if (m > 0) {
            const x = this.hover.lineX();
            ctx.fillStyle = `rgba(255,255,255,${flicker * (1 - 0.4 * m)})`;
            drawStaticBars(ctx);
            const grad = ctx.createLinearGradient(x - 40, 0, x + 40, 0);
            for (const [o, a] of bandStops) grad.addColorStop(o, `rgba(255,255,255,${a * flicker})`);
            ctx.fillStyle = grad;
            drawStaticBars(ctx);
            ctx.fillStyle = `rgba(255,255,255,${m})`;
            ctx.fillRect(Math.round(x), 0, 1, L.vh);
          } else {
            ctx.fillStyle = `rgba(255,255,255,${flicker})`;
            drawStaticBars(ctx);
          }
        } else {
          const te = t - HOLD_END;
          const scanX = L.vw * (te / SCAN);
          ctx.fillStyle = '#fff';
          for (const r of L.rects) {
            const p = clamp01((te - SCAN * (r.x / L.vw)) / SCAN);
            if (p >= 1) continue;
            const g = exitGeom(r, expoIn(p));
            ctx.fillRect(g.x, r.y, g.w, r.h);
          }
          if (te < SCAN) ctx.fillRect(Math.round(scanX), 0, 1, L.vh);
          const m = this.hover.strength(env);
          if (m > 0) {
            ctx.fillStyle = `rgba(255,255,255,${m})`;
            ctx.fillRect(Math.round(this.hover.lineX()), 0, 1, L.vh);
          }
        }

        const fs = clamp(L.lw * 0.036, 9, 11);
        ctx.font = `${fs}px ${MONO}`;
        ctx.textBaseline = 'top';
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        const label = this.hover.label(env) || 'LOG_001';
        const y = L.oy + L.lh + Math.max(14, L.lh * 0.08);
        ctx.fillText(label, L.ox, y);
        ctx.fillText(`F${pad(t * 60, 4)}`, L.ox, y + fs * 1.5);
      },
    });
  }

  // 4. Blueprint
  {
    const GUIDE_DUR = 0.6, IN_START = 0.6, IN_DUR = 1.0, HOLD_END = 3.6, OUT = 1.0;
    const c = { inStart: IN_START, inDur: IN_DUR, inSt: 0.05, holdEnd: HOLD_END, outDur: OUT, outSt: 0.05 };

    function guides() {
      const bx = L.ox, by = L.oy, bw = L.lw, bh = L.lh, cx = L.cx, cy = L.cy;
      const ext = Math.max(24, bw * 0.14), off = Math.max(12, bw * 0.06);
      const segs = [
        [bx - ext, cy, bx + bw + ext, cy],
        [cx, by - ext, cx, by + bh + ext],
        [cx, by, bx + bw, cy], [bx + bw, cy, cx, by + bh], [cx, by + bh, bx, cy], [bx, cy, cx, by],
        [bx, by, bx + bw, by], [bx + bw, by, bx + bw, by + bh], [bx + bw, by + bh, bx, by + bh], [bx, by + bh, bx, by],
        [bx, by - off, bx + bw, by - off],
        [bx - off, by, bx - off, by + bh],
      ];
      const ticks = [];
      for (let i = 0; i <= 12; i++) {
        const len = i % 6 === 0 ? 7 : 4;
        ticks.push({ k: i / 12, seg: [bx + bw * i / 12, by - off, bx + bw * i / 12, by - off - len] });
      }
      for (const b of BARS) {
        if (b.x > 141) continue;
        const y = by + (b.y + b.h / 2) * L.s;
        ticks.push({ k: (y - by) / bh, seg: [bx - off, y, bx - off - 4, y] });
      }
      return { segs, ticks, off, ext };
    }

    STYLES.push({
      name: 'Blueprint',
      loop: 4.8,
      phases: { inEnd: IN_START + IN_DUR, holdEnd: HOLD_END, outEnd: HOLD_END + OUT },
      draw(ctx, env) {
        const t = env.t;
        const G = guides();
        const p = inOutCubic(clamp01(t / GUIDE_DUR));
        const fade = t < IN_START + IN_DUR ? 1 : 1 - 0.8 * inOutCubic(clamp01((t - IN_START - IN_DUR) / 0.8));
        ctx.save();
        if (t >= HOLD_END) {
          const q = EASE_OUT(clamp01((t - HOLD_END) / OUT));
          const right = L.ox + L.lw + G.ext, width = L.lw + G.ext * 2;
          const k = lerp(1, EXIT_STRETCH, q);
          const d = (L.vw - right + width * EXIT_STRETCH + 10) * q;
          ctx.translate(right + d, 0);
          ctx.scale(k, 1);
          ctx.translate(-right, 0);
        }
        if (p > 0 && t < HOLD_END + OUT) {
          ctx.strokeStyle = `rgba(255,255,255,${0.2 * fade})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (const [x1, y1, x2, y2] of G.segs) { ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); }
          for (const tk of G.ticks) {
            if (tk.k > p) continue;
            const [x1, y1, x2, y2] = tk.seg;
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          }
          ctx.stroke();
          const fs = clamp(L.lw * 0.032, 8, 10);
          ctx.font = `${fs}px ${MONO}`;
          ctx.fillStyle = `rgba(255,255,255,${0.2 * fade * p})`;
          ctx.textBaseline = 'bottom';
          ctx.textAlign = 'center';
          ctx.fillText(String(MARK_W), L.cx, L.oy - G.off - 9);
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(MARK_H), L.ox - G.off - 8, L.oy + 4);
          ctx.textAlign = 'left';
        }
        ctx.restore();
        ctx.fillStyle = '#fff';
        drawStdBars(ctx, t, c);
      },
    });
  }

  // 5. Star Burst
  {
    const IN = 0.7, IN_ST = 0.02, HOLD_END = 2.7, STAR = 0.15, OUT_START = HOLD_END + STAR, OUT = 0.6, OUT_ST = 0.02;
    let flashedLoop = -1;

    function geomAt(r, t) {
      if (t < OUT_START) {
        const p = stag(t, 0, IN, IN_ST, r.g);
        if (p <= 0) return null;
        const q = BACK_OUT(p);
        const scale = q <= 1 ? 0.2 + 0.8 * q : 1 + 0.03 * (q - 1) / (BACK_MAX - 1);
        return enterGeom(r, Math.min(q, 1), scale);
      }
      const p = stag(t, OUT_START, OUT, OUT_ST, r.g);
      if (p >= 1) return null;
      return exitGeom(r, expoIn(p));
    }
    function star(ctx, x, y, R, rot) {
      const r = R * 0.16;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = rot + i * Math.PI / 4 - Math.PI / 2;
        const rad = i % 2 === 0 ? R : r;
        ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
    }

    STYLES.push({
      name: 'Star Burst',
      loop: 4.5,
      phases: { inEnd: IN, holdEnd: HOLD_END, outEnd: OUT_START + OUT },
      onLoop() { flashedLoop = -1; },
      draw(ctx, env) {
        const t = env.t;
        const prevT = Math.max(0, t - 1 / 60);
        for (const r of L.rects) {
          const g = geomAt(r, t);
          if (!g) continue;
          const moving = t < IN || t >= OUT_START;
          if (moving) drawStreak(ctx, r, g, geomAt(r, prevT), '255,255,255');
          ctx.fillStyle = '#fff';
          ctx.fillRect(g.x, r.y, g.w, r.h);
        }
        if (t >= HOLD_END && t < OUT_START) {
          const u = (t - HOLD_END) / STAR;
          ctx.fillStyle = '#fff';
          star(ctx, L.cx, L.cy, Math.max(12, L.lw * 0.14) * Math.sin(Math.PI * clamp(u * 1.15, 0, 1)), u * Math.PI / 9);
        }
      },
      composite(env) {
        if (env.t >= HOLD_END && env.t < OUT_START && flashedLoop !== env.loopIndex) {
          flashedLoop = env.loopIndex;
          main.fillStyle = '#fff';
          main.fillRect(0, 0, canvas.width, canvas.height);
        }
      },
    });
  }

  // 6. Final: Clean Sweep timing with Star Burst's streak trails, at the
  // homepage's size and in the homepage mark's cream.
  {
    const c = { inStart: 0, inDur: 1.2, inSt: 0.08, holdEnd: 3.2, outDur: 1.0, outSt: 0.08 };
    const RGB = '245,240,232';
    STYLES.push({
      name: 'Final',
      loop: 4.5,
      size: 'site',
      color: '#F5F0E8',
      phases: { inEnd: 1.2, holdEnd: 3.2, outEnd: 4.2 },
      draw(ctx, env) {
        const t = env.t;
        const moving = t < c.inStart + c.inDur || t >= c.holdEnd;
        const prevT = Math.max(0, t - 1 / 60);
        for (const r of L.rects) {
          const g = stdGeom(r, t, c);
          if (!g) continue;
          if (moving) drawStreak(ctx, r, g, stdGeom(r, prevT, c), RGB);
          ctx.fillStyle = this.color;
          ctx.fillRect(g.x, r.y, g.w, r.h);
        }
      },
    });
  }

  // ---------------------------------------------------------------------------
  // Flip intros (options 7-11). Play once through past Brek marks, then hold
  // the homepage mark. Every mark is rasterised into the same box, its content
  // fitted to the homepage mark's height, so cuts don't jump.
  // ---------------------------------------------------------------------------
  const CREAM = '#F5F0E8', CREAM_RGB = '245,240,232';
  const MARKS = {
    'star-2017': { src: 'marks/star-2017.svg', label: ['BREK_STAR', '2017'] },
    'star-2018': { src: 'marks/star-2018.svg', label: ['BREK_STAR', '2018'] },
    'star-2020': { src: 'marks/star-2020.svg', label: ['BREK_STAR', '2020'] },
    'star-circuit': { src: 'marks/star-circuit.svg', label: ['BREK_STAR_CIRCUIT', '----'] },
    'star-pixel': { src: 'marks/star-pixel.svg', label: ['BREK_STAR_PIXEL', '----'] },
    'star-mindz-eye-lattice': { src: 'marks/star-mindz-eye-lattice.svg', label: ['MINDZ_EYE', '----'] },
    'star-2022': { src: 'marks/star-2022.svg', label: ['BREK_STAR', '2022'] },
    'final': {
      src: 'data:image/svg+xml,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${MARK_W} ${MARK_H}" width="${MARK_W * 4}" height="${MARK_H * 4}" fill="${CREAM}">` +
        BARS.map(b => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`).join('') + '</svg>'),
    },
  };
  // Only cream line-work on transparent may appear here; check_marks.py
  // enforces that for every file in marks/.
  const SAFE = ['star-2017', 'star-2018', 'star-2020', 'star-circuit', 'star-pixel',
    'star-mindz-eye-lattice', 'star-2022'];
  const SEQ_FULL = SAFE;
  const SEQ_GHOST = SAFE;
  const BOX_ASPECT = 1.2;   // box width / height
  const BOX_PAD = 4;
  let marksReady = false;

  const creamNoise = document.createElement('canvas');
  creamNoise.width = 256; creamNoise.height = 32;
  (() => {
    const n = creamNoise.getContext('2d');
    const img = n.createImageData(creamNoise.width, creamNoise.height);
    for (let i = 0; i < img.data.length; i += 4) {
      img.data[i] = 245; img.data[i + 1] = 240; img.data[i + 2] = 232;
      img.data[i + 3] = Math.random() < 0.5 ? 255 : 0;
    }
    n.putImageData(img, 0, 0);
  })();

  function contentBox(img) {
    const H = 400, W = Math.max(1, Math.round(H * img.naturalWidth / img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, W, H);
    const d = x.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) {
      for (let i = 0; i < W; i++) {
        if (d[(y * W + i) * 4 + 3] > 8) {
          if (i < x0) x0 = i; if (i > x1) x1 = i;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) return { x: 0, y: 0, w: 1, h: 1 };
    return { x: x0 / W, y: y0 / H, w: (x1 + 1 - x0) / W, h: (y1 + 1 - y0) / H };
  }

  // Box geometry in CSS px, centred on the homepage mark's position.
  function flipBox() {
    const BH = L.lh, BW = BH * BOX_ASPECT;
    return { BW, BH, RW: BW + BOX_PAD * 2, RH: BH + BOX_PAD * 2, x: L.cx - BW / 2 - BOX_PAD, y: L.cy - BH / 2 - BOX_PAD };
  }
  function buildRasters() {
    if (!marksReady || !L) return;
    const B = flipBox(), d = L.dpr;
    for (const m of Object.values(MARKS)) {
      const c = m.raster || (m.raster = document.createElement('canvas'));
      c.width = Math.round(B.RW * d); c.height = Math.round(B.RH * d);
      const x = c.getContext('2d');
      x.setTransform(d, 0, 0, d, 0, 0);
      x.clearRect(0, 0, B.RW, B.RH);
      const nw = m.img.naturalWidth, nh = m.img.naturalHeight, cb = m.box;
      const aspect = (cb.w * nw) / (cb.h * nh);
      let h = B.BH, w = h * aspect;
      if (w > B.BW) { w = B.BW; h = w / aspect; }
      const k = h / (cb.h * nh);
      const dx = B.RW / 2 - (cb.x + cb.w / 2) * nw * k;
      const dy = B.RH / 2 - (cb.y + cb.h / 2) * nh * k;
      x.drawImage(m.img, dx, dy, nw * k, nh * k);
    }
  }
  const marksLoaded = Promise.all(Object.values(MARKS).map(m => {
    m.img = new Image();
    m.img.src = m.src;
    return m.img.decode().then(() => { m.box = contentBox(m.img); });
  })).then(() => { marksReady = true; buildRasters(); });

  // Draws a mark raster centred in the box, optionally scaled and rotated about
  // its centre, shifted, or with alpha.
  function drawMark(ctx, id, o = {}) {
    const m = MARKS[id], B = flipBox();
    if (!m.raster) return;
    const s = o.scale ?? 1;
    ctx.save();
    ctx.globalAlpha = o.alpha ?? 1;
    ctx.translate(L.cx + (o.dx ?? 0), L.cy + (o.dy ?? 0));
    if (o.rot) ctx.rotate(o.rot);
    ctx.drawImage(m.raster, -(B.RW * s) / 2, -(B.RH * s) / 2, B.RW * s, B.RH * s);
    ctx.restore();
  }
  // rotateY(deg) with perspective, approximated with vertical strips.
  function drawMarkRotY(ctx, id, deg, persp = 800) {
    const m = MARKS[id], B = flipBox();
    if (!m.raster) return;
    const th = deg * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
    if (cos <= 0.001) return;
    const N = 48, sw = B.RW / N, kx = m.raster.width / B.RW;
    const proj = x => x * cos * persp / (persp + x * sin);
    for (let i = 0; i < N; i++) {
      const xa = -B.RW / 2 + i * sw, xb = xa + sw, xm = xa + sw / 2;
      const pa = proj(xa), pb = proj(xb);
      const ph = B.RH * persp / (persp + xm * sin);
      ctx.drawImage(m.raster, i * sw * kx, 0, sw * kx, m.raster.height,
        L.cx + pa, L.cy - ph / 2, pb - pa + 0.6, ph);
    }
  }
  // Draws `base` then re-draws horizontal slices (CSS px from the box top)
  // taken from each slice's own source mark, shifted by dx.
  function drawMarkSlices(ctx, base, slices) {
    const B = flipBox();
    if (base) drawMark(ctx, base);
    for (const s of slices) {
      const m = MARKS[s.src];
      if (!m.raster) continue;
      const ky = m.raster.height / B.RH;
      ctx.fillStyle = '#000';
      ctx.fillRect(B.x - 20, B.y + s.y, B.RW + 40, s.h);
      ctx.drawImage(m.raster, 0, s.y * ky, m.raster.width, s.h * ky, B.x + s.dx, B.y + s.y, B.RW, s.h);
    }
  }
  function drawCreamNoise(ctx, x, y, w, h) {
    const sw = Math.max(1, Math.round(w / 2)), sh = Math.max(1, Math.round(h / 2));
    const sx = Math.floor(Math.random() * Math.max(1, creamNoise.width - sw));
    const sy = Math.floor(Math.random() * Math.max(1, creamNoise.height - sh));
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, w, h);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(creamNoise, sx, sy, Math.min(sw, creamNoise.width), Math.min(sh, creamNoise.height), x, y, w, h);
    ctx.imageSmoothingEnabled = true;
  }
  // Sequential segments: [{id, dur, ...}] -> segment active at t (or null).
  function timeline(segs) {
    let at = 0;
    for (const s of segs) { s.start = at; at += s.dur; s.end = at; }
    return { segs, end: at, at: t => segs.find(s => t >= s.start && t < s.end) || null };
  }
  function flipStyle(o) {
    return Object.assign({
      flip: true, once: true, size: 'site', color: CREAM, loop: Infinity,
      phases: { inEnd: Infinity, holdEnd: Infinity, outEnd: Infinity },
    }, o);
  }

  // 7. Hard Cut Countdown
  {
    const frames = [180, 150, 120, 100, 80, 70, 60];
    const tl = timeline([
      ...SEQ_FULL.map((id, i) => ({ id, dur: frames[i] / 1000 })),
      { id: null, dur: 0.12 },
    ]);
    STYLES.push(flipStyle({
      name: 'Hard Cut Countdown',
      total: tl.end,
      draw(ctx, env) {
        const seg = tl.at(env.t);
        if (env.t >= tl.end) drawMark(ctx, 'final');
        else if (seg && seg.id) drawMark(ctx, seg.id);
      },
    }));
  }

  // 8. Flipbook 3D
  {
    const LEAD = 0.2, SETTLE = 0.2, FINAL_FLIP = 0.4;
    const flips = SEQ_FULL.slice(0, -1).map((id, k) => ({ from: id, to: SEQ_FULL[k + 1], dur: Math.max(0.09, 0.26 * Math.pow(0.85, k)) }));
    const tl = timeline([{ lead: true, dur: LEAD }, ...flips, { from: SEQ_FULL[SEQ_FULL.length - 1], to: 'final', dur: FINAL_FLIP, last: true }]);
    const inOutQuad = p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
    STYLES.push(flipStyle({
      name: 'Flipbook 3D',
      total: tl.end + SETTLE,
      draw(ctx, env) {
        const t = env.t;
        if (t >= tl.end) {
          const k = clamp01((t - tl.end) / SETTLE);
          drawMarkRotY(ctx, 'final', 2 * (1 - outCubic(k)));
          return;
        }
        const seg = tl.at(t);
        if (seg.lead) { drawMark(ctx, SEQ_FULL[0]); return; }
        const e = inOutQuad((t - seg.start) / seg.dur);
        const deg = (seg.last ? 182 : 180) * e;
        if (deg < 90) drawMarkRotY(ctx, seg.from, deg);
        else drawMarkRotY(ctx, seg.to, deg - 180);
      },
    }));
  }

  // 9. Archive Scan
  {
    const n = SEQ_FULL.length;
    const tl = timeline(SEQ_FULL.map((id, i) => ({
      id, dur: (90 + 130 * (1 - Math.pow(i / (n - 1), 2))) / 1000,
      text: `${MARKS[id].label[0]} / ${MARKS[id].label[1]} / FILE ${pad(i + 1, 2)}`,
    })));
    const LAND = 'MAIN / LOG_001', TYPE = 0.3;
    STYLES.push(flipStyle({
      name: 'Archive Scan',
      total: tl.end + TYPE,
      draw(ctx, env) {
        const t = env.t;
        let text;
        if (t >= tl.end) {
          drawMark(ctx, 'final');
          const k = clamp01((t - tl.end) / TYPE);
          text = LAND.slice(0, Math.round(LAND.length * k)) + (k < 1 ? '_' : '');
        } else {
          const seg = tl.at(t);
          drawMark(ctx, seg.id);
          text = seg.text;
        }
        const fs = 9;
        ctx.font = `${fs}px ${MONO}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = `rgba(${CREAM_RGB},0.4)`;
        ctx.fillText(text, L.cx, L.cy + L.lh / 2 + 14);
        ctx.textAlign = 'left';
      },
    }));
  }

  // 10. Glitch Swap
  {
    const FRAME = 1 / 30, LAST_GLITCH = 0.1;
    const ids = [...SEQ_FULL, 'final'];
    const segs = [];
    SEQ_FULL.forEach((id, i) => {
      segs.push({ kind: 'hold', id, dur: (140 - 40 * i / (SEQ_FULL.length - 1)) / 1000 });
      segs.push({ kind: 'swap', from: id, to: ids[i + 1], dur: FRAME * 2 });
    });
    segs.push({ kind: 'glitch', id: 'final', dur: LAST_GLITCH });
    const tl = timeline(segs);
    let lockShown = false;

    function sliceSet(rng, srcs) {
      const B = flipBox();
      const k = 4 + Math.floor(rng() * 3);
      return Array.from({ length: k }, () => {
        const h = 2 + rng() * 10;
        return {
          src: srcs[Math.floor(rng() * srcs.length)],
          y: BOX_PAD + rng() * (B.BH - h), h,
          dx: (rng() < 0.5 ? -1 : 1) * (4 + rng() * 10),
        };
      });
    }

    STYLES.push(flipStyle({
      name: 'Glitch Swap',
      total: tl.end,
      onLoop(env) {
        lockShown = false;
        const rng = env.rng;
        for (const s of tl.segs) {
          if (s.kind === 'swap') {
            s.sets = [sliceSet(rng, [s.from, s.to]), sliceSet(rng, [s.from, s.to])];
            s.noise = { y: BOX_PAD + rng() * flipBox().BH, h: 2 + rng() * 2, drawn: false };
          } else if (s.kind === 'glitch') {
            s.sets = [0, 1, 2].map(() => sliceSet(rng, ['final']));
          }
        }
      },
      draw(ctx, env) {
        const t = env.t;
        if (t >= tl.end) {
          const alpha = lockShown ? 1 : 0.7;
          lockShown = true;
          drawMark(ctx, 'final', { alpha });
          return;
        }
        const seg = tl.at(t);
        const u = t - seg.start;
        if (seg.kind === 'hold') drawMark(ctx, seg.id);
        else if (seg.kind === 'swap') {
          const second = u >= FRAME;
          drawMarkSlices(ctx, second ? seg.to : seg.from, seg.sets[second ? 1 : 0]);
          if (!seg.noise.drawn) {
            seg.noise.drawn = true;
            const B = flipBox();
            drawCreamNoise(ctx, B.x, B.y + seg.noise.y, B.RW, seg.noise.h);
          }
        } else {
          drawMarkSlices(ctx, 'final', seg.sets[Math.min(2, Math.floor(u / FRAME))]);
        }
      },
    }));
  }

  // 11. Ghost Stack
  {
    const n = SEQ_GHOST.length, GHOST = 0.4, ARRIVE = 0.6;
    const tl = timeline(SEQ_GHOST.map((id, i) => ({ id, dur: (180 - 60 * i / (n - 1)) / 1000 })));
    const c = { inStart: tl.end, inDur: ARRIVE, inSt: 0.02, holdEnd: Infinity };
    const arriveGeom = (r, t) => {
      const p = stag(t, c.inStart, c.inDur, c.inSt, r.g);
      if (p <= 0) return null;
      const e = expoOut(p);
      return enterGeom(r, e, 0.2 + 0.8 * e);
    };
    STYLES.push(flipStyle({
      name: 'Ghost Stack',
      total: tl.end + Math.max(ARRIVE, GHOST),
      draw(ctx, env) {
        const t = env.t;
        for (const s of tl.segs) {
          if (t < s.end || t >= s.end + GHOST) continue;
          const k = outCubic((t - s.end) / GHOST);
          drawMark(ctx, s.id, { alpha: 0.15 * (1 - k), scale: 1 + 0.04 * k, dx: 6 * k });
        }
        const seg = tl.at(t);
        if (seg) { drawMark(ctx, seg.id); return; }
        if (t < tl.end) return;
        const prevT = Math.max(0, t - 1 / 60);
        for (const r of L.rects) {
          const g = arriveGeom(r, t);
          if (!g) continue;
          if (t < c.inStart + c.inDur) drawStreak(ctx, r, g, arriveGeom(r, prevT), CREAM_RGB);
          ctx.fillStyle = CREAM;
          ctx.fillRect(g.x, r.y, g.w, r.h);
        }
      },
    }));
  }

  // ---------------------------------------------------------------------------
  // Wild cards (options 12-13). Loop, cream on black, homepage size.
  // ---------------------------------------------------------------------------
  const markLabel = id => (id === 'final' ? 'MAIN / LOG_001' : `${MARKS[id].label[0]} / ${MARKS[id].label[1]}`);
  function readout(ctx, text) {
    ctx.font = `9px ${MONO}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = `rgba(${CREAM_RGB},0.4)`;
    ctx.fillText(text, L.ox, L.oy + L.lh + 14);
  }
  function drawCreamBars(ctx, t, c, streaks) {
    const prevT = Math.max(0, t - 1 / 60);
    for (const r of L.rects) {
      const g = stdGeom(r, t, c);
      if (!g) continue;
      if (streaks) drawStreak(ctx, r, g, stdGeom(r, prevT, c), CREAM_RGB);
      ctx.fillStyle = CREAM;
      ctx.fillRect(g.x, r.y, g.w, r.h);
    }
  }

  // 12. Signal Hunt
  {
    const HUNT = 1.2, HOLD = 2.5, FRAME = 1 / 30, SLOW_EVERY = 4, SLOW = 0.25;
    let st = null;

    function plan(loop) {
      const rng = mulberry32(SESSION_SEED ^ (loop * 2654435761));
      const slow = loop % SLOW_EVERY === SLOW_EVERY - 1;
      const segs = [];
      let prev = null, at = 0;
      while (at < HUNT - 1e-6) {
        let id;
        do id = SAFE[Math.floor(rng() * SAFE.length)]; while (id === prev);
        const dur = slow ? SLOW : Math.min(0.06 + rng() * 0.03, HUNT - at);
        segs.push({ kind: 'mark', id, dur });
        prev = id;
        at += dur;
      }
      segs.push({ kind: 'hold', id: 'final', dur: HOLD });
      const B = flipBox();
      const sliceSets = [0, 1].map(() => Array.from({ length: 4 + Math.floor(rng() * 3) }, () => {
        const h = 2 + rng() * 10;
        return { src: 'final', y: BOX_PAD + rng() * (B.BH - h), h, dx: (rng() < 0.5 ? -1 : 1) * (4 + rng() * 10) };
      }));
      segs.push({ kind: 'break', id: 'final', dur: FRAME * 2, sets: sliceSets });
      return { loop, clock: 0, tl: timeline(segs) };
    }

    STYLES.push({
      name: 'Signal Hunt',
      wild: true,
      tag: '· wild · hover or touch the mark to freeze',
      size: 'site',
      color: CREAM,
      loop: Infinity,
      phases: { inEnd: Infinity, holdEnd: Infinity, outEnd: Infinity },
      onLoop() { st = plan(0); },
      draw(ctx, env) {
        const frozen = env.pointer.inside || env.pointer.pressed;
        if (marksReady && !frozen) st.clock += env.dt;
        while (st.clock >= st.tl.end) {
          const over = st.clock - st.tl.end;
          st = plan(st.loop + 1);
          st.clock = over;
        }
        const seg = st.tl.at(st.clock);
        const u = st.clock - seg.start;
        if (seg.kind === 'mark') drawMark(ctx, seg.id);
        else if (seg.kind === 'hold') {
          drawMark(ctx, 'final');
          const B = flipBox();
          const y = Math.round(L.cy - B.BH / 2 + B.BH * (u / seg.dur)) + 0.5;
          ctx.fillStyle = `rgba(${CREAM_RGB},0.55)`;
          ctx.fillRect(L.cx - B.BW / 2 - 12, y - 0.5, B.BW + 24, 1);
        } else {
          drawMarkSlices(ctx, 'final', seg.sets[Math.min(1, Math.floor(u / FRAME))]);
        }
        if (frozen) readout(ctx, markLabel(seg.id));
        else if (seg.kind === 'hold') readout(ctx, 'LOCK / LOG_001');
      },
    });
  }

  // 13. Exploded Archive
  {
    const LOOP = 7.0, P1 = 1.0, P2 = 2.2, P3 = 6.0, STAG = 0.12, FULL_LOOPS = 3;
    const FLY = (P2 - P1) - STAG * (SAFE.length - 1);
    const c = { inStart: P2, inDur: 1.2, inSt: 0.08, holdEnd: P3, outDur: 1.0, outSt: 0.08 };
    let rots = [];

    function ring() {
      const mobile = L.vw <= 600;
      const vmin = Math.min(L.vw, L.vh);
      const R = (mobile ? 0.34 : 0.28) * vmin;
      const scale = mobile ? 0.6 : 0.5;
      return SAFE.map((id, i) => {
        const a = -Math.PI / 2 + i * 2 * Math.PI / SAFE.length;
        return { id, x: Math.cos(a) * R, y: Math.sin(a) * R, rot: rots[i] || 0, scale };
      });
    }
    // Curved path from a ring slot to the centre, bowing clockwise.
    function flyPos(p, q) {
      const k = Math.PI / 3, cx = (p.x * Math.cos(k) - p.y * Math.sin(k)) * 0.6, cy = (p.x * Math.sin(k) + p.y * Math.cos(k)) * 0.6;
      const m = 1 - q;
      return { x: m * m * p.x + 2 * m * q * cx, y: m * m * p.y + 2 * m * q * cy };
    }

    STYLES.push({
      name: 'Exploded Archive',
      wild: true,
      tag: '· wild · click the mark to replay',
      size: 'site',
      color: CREAM,
      loop: LOOP,
      tapToReplay: true,
      phases: { inEnd: P2, holdEnd: P3, outEnd: LOOP },
      holdAt: loopIndex => (loopIndex >= FULL_LOOPS ? P3 - 1e-4 : null),
      onLoop(env) {
        if (env.loopIndex === 0) rots = SAFE.map(() => (env.rng() * 2 - 1) * 8 * Math.PI / 180);
      },
      draw(ctx, env) {
        const t = marksReady ? env.t : 0;
        const slots = ring();
        let center = null;

        slots.forEach((s, i) => {
          if (t < P1) {
            const a = env.loopIndex === 0 ? 0.3 * outCubic(clamp01((t - i * 0.05) / (P1 - 0.3))) : 0.3;
            drawMark(ctx, s.id, { dx: s.x, dy: s.y, rot: s.rot, scale: s.scale, alpha: a });
          } else if (t < P2) {
            const start = P1 + i * STAG;
            if (t < start) {
              drawMark(ctx, s.id, { dx: s.x, dy: s.y, rot: s.rot, scale: s.scale, alpha: 0.3 });
            } else if (t < start + FLY) {
              const q = expoIn((t - start) / FLY);
              const p = flyPos(s, q);
              drawMark(ctx, s.id, { dx: p.x, dy: p.y, rot: s.rot * (1 - q), scale: s.scale * (1 - 0.5 * q), alpha: 0.3 + 0.5 * q });
            } else {
              center = s.id;
            }
          } else if (t >= P3) {
            const a = 0.3 * outCubic(clamp01((t - P3) / (LOOP - P3)));
            drawMark(ctx, s.id, { dx: s.x, dy: s.y, rot: s.rot, scale: s.scale, alpha: a });
          }
        });

        if (t >= P1 && t < P2) {
          if (center) drawMark(ctx, center);
        } else if (t >= P2) {
          const moving = t < c.inStart + c.inDur || t >= P3;
          drawCreamBars(ctx, t, c, moving);
        }
      },
    });
  }

  // ---------------------------------------------------------------------------
  // Engine
  // ---------------------------------------------------------------------------
  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  const hoverMQ = window.matchMedia('(hover: hover)');
  let forceMotion = false;
  const motionOn = () => forceMotion || !reduceMQ.matches;
  const hoverAllowed = () => !reduceMQ.matches;

  let current = 0, t = 0, loopIndex = 0, last = null, rng = null;
  let gate = 0, hovering = false, touchActive = false;
  const pointer = { x: -1, y: -1, inside: false, pressed: false };

  const els = {
    idx: document.getElementById('idx'),
    name: document.getElementById('name'),
    tag: document.getElementById('tag'),
    note: document.getElementById('note'),
    opts: [...document.querySelectorAll('.opt')],
    size: document.getElementById('size'),
  };

  const style = () => STYLES[current];
  function phaseOf(s, tt) {
    if (tt < s.phases.inEnd) return 'in';
    if (tt < s.phases.holdEnd) return 'hold';
    if (tt < s.phases.outEnd) return 'out';
    return 'gap';
  }
  function makeEnv(now, dt) {
    const s = style();
    return {
      t, dt, now, loopIndex, rng, L, pointer, gate, hovering,
      phase: phaseOf(s, t),
      touchMode: touchActive || !hoverMQ.matches,
    };
  }
  function startLoop(now) {
    rng = mulberry32(SESSION_SEED + loopIndex * 7919 + current * 104729);
    style().onLoop?.(makeEnv(now, 0));
  }
  function restart() {
    t = 0; loopIndex = 0; gate = 0; hovering = false;
    style().hover?.reset();
    startLoop(performance.now() / 1000);
  }

  function select(i) {
    current = (i + STYLES.length) % STYLES.length;
    const s = style();
    els.idx.textContent = `${pad(current + 1, 2)}/${pad(STYLES.length, 2)}`;
    els.name.textContent = s.name;
    els.tag.textContent = s.tag ? s.tag
      : s.flip ? '· flip · plays once'
      : s.hover ? (hoverAllowed() ? (hoverMQ.matches ? '· hover the logo during the hold' : '· tap or drag the logo during the hold') : '· hover off (reduced motion)') : '';
    els.opts.forEach((b, k) => b.setAttribute('aria-pressed', String(k === current)));
    els.size.disabled = !!s.size;
    els.size.textContent = s.size ? 'Site size' : (sizeMode === 'large' ? 'Large' : 'Site size');
    history.replaceState(null, '', location.pathname + '#' + (current + 1));
    layout();
    restart();
  }

  function updateNote() {
    if (reduceMQ.matches && !forceMotion) {
      els.note.hidden = false;
      els.note.innerHTML = '· reduced motion: static logo <button type="button">play anyway</button>';
      els.note.querySelector('button').onclick = () => { forceMotion = true; updateNote(); restart(); };
    } else {
      els.note.hidden = true;
    }
  }

  function render(now, dt) {
    const s = style();
    bctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    bctx.fillStyle = '#000';
    bctx.fillRect(0, 0, L.vw, L.vh);

    if (!motionOn()) {
      if (s.flip) bctx.globalAlpha = marksReady ? clamp01(t / 0.3) : 0;
      bctx.fillStyle = s.color || '#fff';
      drawStaticBars(bctx);
      bctx.globalAlpha = 1;
      main.setTransform(1, 0, 0, 1, 0, 0);
      main.drawImage(buf, 0, 0);
      return;
    }

    const env = makeEnv(now, dt);
    s.draw(bctx, env);
    main.setTransform(1, 0, 0, 1, 0, 0);
    main.drawImage(buf, 0, 0);
    s.composite?.(env);
    s.hover?.composite?.(env);
  }

  function tick(nowMs) {
    const now = nowMs / 1000;
    const dt = last === null ? 0 : Math.min(0.1, now - last);
    last = now;
    const s = style();

    if (s.flip) {
      t = marksReady ? t + dt : 0;
    } else if (motionOn()) {
      const H = s.hover && hoverAllowed() ? s.hover : null;
      let nt = t + dt;
      if (H?.holdWhileHovering && hovering && t < s.phases.holdEnd && nt >= s.phases.holdEnd) nt = s.phases.holdEnd - 1e-4;
      const stopAt = s.holdAt?.(loopIndex);
      if (stopAt != null && nt >= stopAt) nt = stopAt;
      t = nt;
      if (t >= s.loop) {
        t -= s.loop;
        loopIndex++;
        startLoop(now);
      }

      if (H) {
        const inHold = phaseOf(s, t) === 'hold';
        gate = inHold ? 1 : Math.max(0, gate - dt / 0.15);
        const want = inHold && pointer.inside && !touchActive && hoverMQ.matches;
        const env = makeEnv(now, dt);
        if (want && !hovering) { hovering = true; env.hovering = true; H.enter(env); }
        else if (!want && hovering) { hovering = false; env.hovering = false; if (inHold) H.leave(env); }
        H.update(env);
        if (!inHold && gate === 0 && H.busy()) H.reset();
      }
    }

    canvas.style.cursor = s.tapToReplay && pointer.inside ? 'pointer' : '';
    render(now, dt);
    requestAnimationFrame(tick);
  }

  // Input ---------------------------------------------------------------------
  const isTouchInput = e => e.pointerType === 'touch' || !hoverMQ.matches;
  const inHoldNow = () => phaseOf(style(), t) === 'hold';
  const hoverTarget = () => (motionOn() && hoverAllowed() ? style().hover : null);

  canvas.addEventListener('pointermove', e => {
    if (isTouchInput(e)) {
      const H = hoverTarget();
      if (touchActive && H && inHoldNow()) H.touch('move', { x: e.clientX, y: e.clientY }, makeEnv(performance.now() / 1000, 0));
      return;
    }
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.inside = hitLogo(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerleave', e => {
    if (!isTouchInput(e)) pointer.inside = false;
  });
  canvas.addEventListener('pointerdown', e => {
    if (hitLogo(e.clientX, e.clientY, 40)) {
      pointer.pressed = true;
      canvas.setPointerCapture?.(e.pointerId);
    }
    if (!isTouchInput(e)) return;
    const H = hoverTarget();
    if (!H || !inHoldNow() || !hitLogo(e.clientX, e.clientY, 40)) return;
    touchActive = true;
    canvas.setPointerCapture?.(e.pointerId);
    H.touch('start', { x: e.clientX, y: e.clientY }, makeEnv(performance.now() / 1000, 0));
  });
  const endTouch = e => {
    if (pointer.pressed) {
      pointer.pressed = false;
      if (e.type === 'pointerup' && style().tapToReplay && hitLogo(e.clientX, e.clientY, 40)) restart();
    }
    if (!touchActive) return;
    touchActive = false;
    style().hover?.touch('end', { x: e.clientX, y: e.clientY }, makeEnv(performance.now() / 1000, 0));
  };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);

  els.opts.forEach(b => b.addEventListener('click', () => select(+b.dataset.i)));
  document.getElementById('replay').addEventListener('click', restart);
  els.size.addEventListener('click', () => {
    sizeMode = sizeMode === 'large' ? 'site' : 'large';
    els.size.textContent = sizeMode === 'large' ? 'Large' : 'Site size';
    layout();
    restart();
  });
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { select(current + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { select(current - 1); e.preventDefault(); }
    else if (/^[1-9]$/.test(e.key)) select(+e.key - 1);
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  window.addEventListener('resize', () => { layout(); });
  window.addEventListener('hashchange', () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (n >= 1 && n <= STYLES.length && n - 1 !== current) select(n - 1);
  });
  const onMQ = () => { updateNote(); select(current); };
  reduceMQ.addEventListener?.('change', onMQ);
  hoverMQ.addEventListener?.('change', onMQ);

  layout();
  updateNote();
  const DEFAULT_OPTION = 6;
  const requested = parseInt(new URLSearchParams(location.search).get('v') || location.hash.slice(1), 10);
  select((requested >= 1 && requested <= STYLES.length ? requested : DEFAULT_OPTION) - 1);
  marksLoaded.then(() => { if (style().flip || style().wild) restart(); });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
