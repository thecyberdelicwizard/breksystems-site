<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brek Systems LLC</title>
  <meta name="description" content="Brek Systems LLC is a Michigan software studio. Builder and operator of Global Plaza, a 3D shopping and social platform.">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark {
      display: block;
      width: clamp(72px, 18vw, 120px);
      height: auto;
    }
  </style>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <img class="mark" src="brek-mark.png" alt="Brek Systems" width="120" height="120">
  <script>
  // Animates the mark: its 18 lines sweep in from the left with motion-blur
  // streaks, hold, then stretch out to the right, on a 4.5 s loop. The img
  // stays in place (invisible, still read by screen readers) to fix the size
  // and position; without JS or with reduced motion it simply shows as is.
  (() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    const img = document.querySelector('.mark');
    if (reduce.matches || !img) return;

    const W = 282, H = 281;
    const BARS = [
      [0, 133.61, 0.69, 14.64, 13.91], [1, 128.71, 23.61, 24.47, 13.12], [2, 117, 45.81, 47.76, 12.93],
      [3, 102.69, 68, 76.34, 12.96], [4, 81.34, 90.24, 46.6, 12.93], [4, 153.75, 90.24, 44.26, 12.95],
      [5, 44.48, 112.21, 61.61, 13.27], [5, 175.64, 112.21, 61.63, 13.27], [6, 0.82, 134.46, 83.43, 12.82],
      [6, 197.65, 134.46, 83.39, 12.82], [7, 44.49, 156.49, 61.5, 13.09], [7, 175.66, 156.49, 61.51, 13.09],
      [8, 83.65, 178.54, 44.26, 13.13], [8, 153.76, 178.54, 46.61, 13.11], [9, 102.71, 200.78, 76.2, 12.89],
      [10, 117, 223, 47.91, 12.93], [11, 128.71, 244.85, 24.44, 13.05], [12, 133.6, 267.15, 14.69, 13.82],
    ];
    const LOOP = 4.5, IN = 1.2, HOLD_END = 3.2, OUT = 1.0, STAGGER = 0.08, MAX_G = 6, STRETCH = 3;
    const RGB = '245,240,232';

    function bezier(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
      return x => {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        let lo = 0, hi = 1, t = x;
        for (let i = 0; i < 30; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const easeIn = bezier(0.16, 1, 0.3, 1), easeOut = bezier(0.7, 0, 0.84, 0);
    const clamp01 = v => Math.min(1, Math.max(0, v));

    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    img.style.opacity = '0';

    let vw = 0, vh = 0;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      vw = window.innerWidth; vh = window.innerHeight;
      canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function geom(r, g, t) {
      if (t < HOLD_END) {
        const p = clamp01((t - g * STAGGER) / (IN - STAGGER * MAX_G));
        if (p <= 0) return null;
        const e = easeIn(p), start = -r.w * 0.2 - 4;
        return { x: start + (r.x - start) * e, w: r.w * (0.2 + 0.8 * e) };
      }
      const p = clamp01((t - HOLD_END - g * STAGGER) / (OUT - STAGGER * MAX_G));
      if (p >= 1) return null;
      const e = easeOut(p), right = r.x + r.w + (vw + r.w * STRETCH + 4 - r.x - r.w) * e;
      const w = r.w * (1 + (STRETCH - 1) * e);
      return { x: right - w, w };
    }

    let t = 0, last = null, raf = 0;
    function frame(ms) {
      const dt = last === null ? 0 : Math.min(0.1, (ms - last) / 1000);
      last = ms;
      t = (t + dt) % LOOP;
      const box = img.getBoundingClientRect(), s = box.width / W;
      const moving = t < IN || t >= HOLD_END;
      ctx.clearRect(0, 0, vw, vh);
      for (const [row, bx, by, bw, bh] of BARS) {
        const g = Math.abs(row - 6);
        const r = { x: box.left + bx * s, y: box.top + by * s, w: bw * s, h: bh * s };
        const now = geom(r, g, t);
        if (!now) continue;
        if (moving) {
          const prev = geom(r, g, Math.max(0, t - 1 / 60));
          const v = prev ? Math.abs(now.x + now.w - prev.x - prev.w) : 0;
          const len = Math.min(v * 4, vw * 0.6);
          if (len > 2) {
            const grad = ctx.createLinearGradient(now.x - len, 0, now.x, 0);
            grad.addColorStop(0, `rgba(${RGB},0)`);
            grad.addColorStop(1, `rgba(${RGB},0.45)`);
            ctx.fillStyle = grad;
            ctx.fillRect(now.x - len, r.y + r.h * 0.2, len, r.h * 0.6);
          }
        }
        ctx.fillStyle = `rgb(${RGB})`;
        ctx.fillRect(now.x, r.y, now.w, r.h);
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);

    reduce.addEventListener?.('change', () => {
      if (!reduce.matches) return;
      cancelAnimationFrame(raf);
      canvas.remove();
      img.style.opacity = '';
    });
  })();
  </script>
</body>
</html>
